<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Pipeline Architecture</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const SwarmAgentFlowDiagram = () => {
      const [activeSection, setActiveSection] = useState('main');
      
      const AgentNode = ({ name, color, x, y, icon, description }) => (
        <g transform={`translate(${x}, ${y})`}>
          <rect
            x="-70"
            y="-30"
            width="140"
            height="60"
            rx="8"
            fill={color}
            stroke="#1e293b"
            strokeWidth="2"
          />
          <text
            x="0"
            y="-5"
            textAnchor="middle"
            fill="white"
            fontSize="12"
            fontWeight="bold"
          >
            {icon} {name}
          </text>
          <text
            x="0"
            y="15"
            textAnchor="middle"
            fill="rgba(255,255,255,0.8)"
            fontSize="9"
          >
            {description}
          </text>
        </g>
      );

      const Arrow = ({ x1, y1, x2, y2, color = "#64748b", label, labelOffset = 0, curved = false, dashed = false }) => {
        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;
        
        if (curved) {
          const controlX = midX + labelOffset;
          const controlY = midY - 40;
          return (
            <g>
              <defs>
                <marker
                  id={`arrowhead-${color.replace('#', '')}`}
                  markerWidth="10"
                  markerHeight="7"
                  refX="9"
                  refY="3.5"
                  orient="auto"
                >
                  <polygon points="0 0, 10 3.5, 0 7" fill={color} />
                </marker>
              </defs>
              <path
                d={`M ${x1} ${y1} Q ${controlX} ${controlY} ${x2} ${y2}`}
                fill="none"
                stroke={color}
                strokeWidth="2"
                strokeDasharray={dashed ? "5,5" : "none"}
                markerEnd={`url(#arrowhead-${color.replace('#', '')})`}
              />
              {label && (
                <text
                  x={controlX}
                  y={controlY - 5}
                  textAnchor="middle"
                  fill={color}
                  fontSize="10"
                  fontWeight="500"
                >
                  {label}
                </text>
              )}
            </g>
          );
        }
        
        return (
          <g>
            <defs>
              <marker
                id={`arrowhead-${color.replace('#', '')}`}
                markerWidth="10"
                markerHeight="7"
                refX="9"
                refY="3.5"
                orient="auto"
              >
                <polygon points="0 0, 10 3.5, 0 7" fill={color} />
              </marker>
            </defs>
            <line
              x1={x1}
              y1={y1}
              x2={x2}
              y2={y2}
              stroke={color}
              strokeWidth="2"
              strokeDasharray={dashed ? "5,5" : "none"}
              markerEnd={`url(#arrowhead-${color.replace('#', '')})`}
            />
            {label && (
              <text
                x={midX + labelOffset}
                y={midY - 8}
                textAnchor="middle"
                fill={color}
                fontSize="10"
                fontWeight="500"
              >
                {label}
              </text>
              )}
          </g>
        );
      };

      const DataStore = ({ x, y, label, sublabel }) => (
        <g transform={`translate(${x}, ${y})`}>
          <ellipse cx="0" cy="0" rx="50" ry="20" fill="#1e1b4b" stroke="#6366f1" strokeWidth="2" />
          <ellipse cx="0" cy="10" rx="50" ry="20" fill="#1e1b4b" stroke="#6366f1" strokeWidth="2" />
          <rect x="-50" y="0" width="100" height="10" fill="#1e1b4b" />
          <text x="0" y="5" textAnchor="middle" fill="#a5b4fc" fontSize="10" fontWeight="bold">{label}</text>
          <text x="0" y="17" textAnchor="middle" fill="#818cf8" fontSize="8">{sublabel}</text>
        </g>
      );

      return (
        <div className="bg-slate-900 p-6 min-h-screen">
          <div className="max-w-6xl mx-auto">
            <h1 className="text-2xl font-bold text-white mb-2 text-center">
              Agent Pipeline Architecture
            </h1>
            <p className="text-slate-400 text-center mb-6 text-sm">
              Information flow, failure recovery, and continuous learning system
            </p>
            
            {/* Tab Navigation */}
            <div className="flex justify-center gap-2 mb-6">
              {['main', 'failure', 'learning'].map((section) => (
                <button
                  key={section}
                  onClick={() => setActiveSection(section)}
                  className={`px-4 py-2 rounded-lg text-sm font-medium transition-all cursor-pointer ${
                    activeSection === section
                      ? 'bg-indigo-600 text-white'
                      : 'bg-slate-800 text-slate-400 hover:bg-slate-700'
                  }`}
                >
                  {section === 'main' && '📊 Main Pipeline'}
                  {section === 'failure' && '🔄 Failure Loop'}
                  {section === 'learning' && '📚 Learning System'}
                </button>
              ))}
            </div>

            {/* Main Pipeline View */}
            {activeSection === 'main' && (
              <div className="bg-slate-800 rounded-xl p-4 overflow-x-auto">
                <svg width="1100" height="580" viewBox="0 0 1100 580">
                  {/* Background Grid */}
                  <defs>
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" strokeWidth="0.5" opacity="0.3"/>
                    </pattern>
                  </defs>
                  <rect width="100%" height="100%" fill="url(#grid)" />
                  
                  {/* User Input */}
                  <g transform="translate(80, 100)">
                    <circle r="35" fill="#059669" stroke="#10b981" strokeWidth="3"/>
                    <text y="-5" textAnchor="middle" fill="white" fontSize="20">👤</text>
                    <text y="15" textAnchor="middle" fill="white" fontSize="10" fontWeight="bold">USER</text>
                  </g>
                  
                  {/* Main Agent Flow - Horizontal */}
                  <AgentNode name="Clarifying" color="#7c3aed" x={200} y={100} icon="🎯" description="Gathers requirements" />
                  <AgentNode name="Spec Agent" color="#2563eb" x={350} y={100} icon="📋" description="Creates PRD/specs" />
                  <AgentNode name="Ticket Agent" color="#0891b2" x={500} y={100} icon="🎫" description="DAG decomposition" />
                  <AgentNode name="Coding Agent" color="#16a34a" x={650} y={100} icon="💻" description="Implements code" />
                  <AgentNode name="Sentinel" color="#ea580c" x={800} y={100} icon="🛡️" description="Reviews & validates" />
                  <AgentNode name="Deploy Agent" color="#dc2626" x={950} y={100} icon="🚀" description="Ships to prod" />
                  
                  {/* Arrows between agents */}
                  <Arrow x1={115} y1={100} x2={125} y2={100} color="#10b981" />
                  <Arrow x1={275} y1={100} x2={275} y2={100} color="#8b5cf6" />
                  <Arrow x1={270} y1={100} x2={280} y2={100} color="#8b5cf6" />
                  <Arrow x1={420} y1={100} x2={430} y2={100} color="#3b82f6" />
                  <Arrow x1={570} y1={100} x2={580} y2={100} color="#06b6d4" />
                  <Arrow x1={720} y1={100} x2={730} y2={100} color="#22c55e" />
                  <Arrow x1={870} y1={100} x2={880} y2={100} color="#f97316" label="✅ PASS" />
                  
                  {/* Data Artifacts */}
                  <DataStore x={200} y={220} label="Requirements" sublabel="User stories" />
                  <DataStore x={350} y={220} label="PRD/Specs" sublabel="Technical spec" />
                  <DataStore x={500} y={220} label="Tickets" sublabel="DAG structure" />
                  <DataStore x={650} y={220} label="Code/PR" sublabel="Branch + changes" />
                  <DataStore x={800} y={220} label="Review" sublabel="Pass/Fail + notes" />
                  <DataStore x={950} y={220} label="Deployed" sublabel="Production" />
                  
                  {/* Vertical arrows to data stores */}
                  <Arrow x1={200} y1={130} x2={200} y2={195} color="#a78bfa" dashed />
                  <Arrow x1={350} y1={130} x2={350} y2={195} color="#60a5fa" dashed />
                  <Arrow x1={500} y1={130} x2={500} y2={195} color="#22d3ee" dashed />
                  <Arrow x1={650} y1={130} x2={650} y2={195} color="#4ade80" dashed />
                  <Arrow x1={800} y1={130} x2={800} y2={195} color="#fb923c" dashed />
                  <Arrow x1={950} y1={130} x2={950} y2={195} color="#f87171" dashed />
                  
                  {/* RAG Knowledge Base - Central */}
                  <g transform="translate(575, 350)">
                    <rect x="-80" y="-35" width="160" height="70" rx="10" fill="#1e1b4b" stroke="#8b5cf6" strokeWidth="3" />
                    <text x="0" y="-10" textAnchor="middle" fill="white" fontSize="12" fontWeight="bold">📖 RAG Knowledge Base</text>
                    <text x="0" y="8" textAnchor="middle" fill="#a5b4fc" fontSize="9">Vector embeddings</text>
                    <text x="0" y="22" textAnchor="middle" fill="#a5b4fc" fontSize="9">Code patterns & context</text>
                  </g>
                  
                  {/* Playbook - Injected into agents */}
                  <g transform="translate(200, 350)">
                    <rect x="-70" y="-30" width="140" height="60" rx="8" fill="#7c2d12" stroke="#f97316" strokeWidth="2" />
                    <text x="0" y="-8" textAnchor="middle" fill="white" fontSize="11" fontWeight="bold">📜 PLAYBOOK</text>
                    <text x="0" y="8" textAnchor="middle" fill="#fed7aa" fontSize="9">Rules, patterns, guidelines</text>
                    <text x="0" y="20" textAnchor="middle" fill="#fdba74" fontSize="8">Injected into agent prompts</text>
                  </g>
                  
                  {/* RAG feeds Clarifying Agent */}
                  <defs>
                    <marker id="arrowhead-rag-feed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6" />
                    </marker>
                    <marker id="arrowhead-rag-index" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e" />
                    </marker>
                    <marker id="arrowhead-playbook-inject" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                      <polygon points="0 0, 10 3.5, 0 7" fill="#f97316" />
                    </marker>
                  </defs>
                  
                  {/* RAG to Clarifying Agent */}
                  <path
                    d="M 500 340 Q 350 280 200 130"
                    fill="none"
                    stroke="#8b5cf6"
                    strokeWidth="2"
                    markerEnd="url(#arrowhead-rag-feed)"
                  />
                  <text x="320" y="280" fill="#c4b5fd" fontSize="8">Context for</text>
                  <text x="320" y="290" fill="#c4b5fd" fontSize="8">requirements</text>
                  
                  {/* RAG to Coding Agent */}
                  <path
                    d="M 520 320 Q 500 250 650 130"
                    fill="none"
                    stroke="#8b5cf6"
                    strokeWidth="2"
                    markerEnd="url(#arrowhead-rag-feed)"
                  />
                  <text x="545" y="240" fill="#a5b4fc" fontSize="8">Code patterns</text>
                  
                  {/* RAG to Sentinel */}
                  <path
                    d="M 620 320 Q 700 250 800 130"
                    fill="none"
                    stroke="#8b5cf6"
                    strokeWidth="2"
                    strokeDasharray="3,3"
                    markerEnd="url(#arrowhead-rag-feed)"
                  />
                  <text x="730" y="240" fill="#c4b5fd" fontSize="8">Review context</text>
                  
                  {/* Deploy Agent reindexes RAG */}
                  <path
                    d="M 950 130 L 950 280 Q 950 320 800 350 L 660 350"
                    fill="none"
                    stroke="#22c55e"
                    strokeWidth="2"
                    strokeDasharray="5,5"
                    markerEnd="url(#arrowhead-rag-index)"
                  />
                  <text x="870" y="270" fill="#4ade80" fontSize="9" fontWeight="bold">Reindex on deploy</text>
                  
                  {/* Playbook injection arrows to agents */}
                  <path
                    d="M 200 320 L 200 130"
                    fill="none"
                    stroke="#f97316"
                    strokeWidth="2"
                    strokeDasharray="4,2"
                    markerEnd="url(#arrowhead-playbook-inject)"
                  />
                  <path
                    d="M 230 320 Q 290 250 350 130"
                    fill="none"
                    stroke="#f97316"
                    strokeWidth="2"
                    strokeDasharray="4,2"
                    markerEnd="url(#arrowhead-playbook-inject)"
                  />
                  <path
                    d="M 260 320 Q 380 250 500 130"
                    fill="none"
                    stroke="#f97316"
                    strokeWidth="2"
                    strokeDasharray="4,2"
                    markerEnd="url(#arrowhead-playbook-inject)"
                  />
                  <path
                    d="M 270 330 Q 450 280 650 130"
                    fill="none"
                    stroke="#f97316"
                    strokeWidth="1.5"
                    strokeDasharray="4,2"
                    markerEnd="url(#arrowhead-playbook-inject)"
                  />
                  <path
                    d="M 270 340 Q 520 300 800 130"
                    fill="none"
                    stroke="#f97316"
                    strokeWidth="1.5"
                    strokeDasharray="4,2"
                    markerEnd="url(#arrowhead-playbook-inject)"
                  />
                  <text x="120" y="280" fill="#fdba74" fontSize="8" fontWeight="bold">Prompt injection</text>
                  
                  {/* Legend */}
                  <g transform="translate(50, 400)">
                    <rect x="0" y="0" width="280" height="150" rx="8" fill="#1e293b" stroke="#475569" strokeWidth="1" />
                    <text x="140" y="25" textAnchor="middle" fill="white" fontSize="12" fontWeight="bold">📖 Pipeline Legend</text>
                    <line x1="20" y1="35" x2="260" y2="35" stroke="#475569" />
                    
                    <circle cx="30" cy="55" r="8" fill="#059669" />
                    <text x="50" y="59" fill="#94a3b8" fontSize="10">User: Project initiator</text>
                    
                    <rect x="22" y="72" width="16" height="16" rx="3" fill="#7c3aed" />
                    <text x="50" y="84" fill="#94a3b8" fontSize="10">Clarifying: Refines vague requests</text>
                    
                    <rect x="22" y="97" width="16" height="16" rx="3" fill="#2563eb" />
                    <text x="50" y="109" fill="#94a3b8" fontSize="10">Spec: Generates technical PRD</text>
                    
                    <rect x="22" y="122" width="16" height="16" rx="3" fill="#0891b2" />
                    <text x="50" y="134" fill="#94a3b8" fontSize="10">Ticket: Creates work breakdown</text>
                  </g>
                  
                  <g transform="translate(350, 400)">
                    <rect x="0" y="0" width="280" height="150" rx="8" fill="#1e293b" stroke="#475569" strokeWidth="1" />
                    <text x="140" y="25" textAnchor="middle" fill="white" fontSize="12" fontWeight="bold">⚙️ Processing Stages</text>
                    <line x1="20" y1="35" x2="260" y2="35" stroke="#475569" />
                    
                    <rect x="22" y="47" width="16" height="16" rx="3" fill="#16a34a" />
                    <text x="50" y="59" fill="#94a3b8" fontSize="10">Coding: 1 VM per ticket, creates PR</text>
                    
                    <rect x="22" y="72" width="16" height="16" rx="3" fill="#ea580c" />
                    <text x="50" y="84" fill="#94a3b8" fontSize="10">Sentinel: Code review + tests</text>
                    
                    <rect x="22" y="97" width="16" height="16" rx="3" fill="#dc2626" />
                    <text x="50" y="109" fill="#94a3b8" fontSize="10">Deploy: Merge + ship to production</text>
                    
                    <ellipse cx="30" cy="130" rx="12" ry="8" fill="#1e1b4b" stroke="#6366f1" strokeWidth="1" />
                    <text x="50" y="134" fill="#94a3b8" fontSize="10">Data stores: Artifacts between stages</text>
                  </g>
                  
                  {/* RAG + Playbook Info Box */}
                  <g transform="translate(650, 400)">
                    <rect x="0" y="0" width="400" height="150" rx="8" fill="#1e293b" stroke="#8b5cf6" strokeWidth="2" />
                    <text x="200" y="25" textAnchor="middle" fill="white" fontSize="12" fontWeight="bold">📖 RAG + 📜 Playbook Integration</text>
                    <line x1="20" y1="35" x2="380" y2="35" stroke="#475569" />
                    <text x="20" y="52" fill="#c4b5fd" fontSize="9" fontWeight="bold">RAG (purple) - Dynamic context retrieval:</text>
                    <text x="30" y="67" fill="#a5b4fc" fontSize="9">• Clarifying queries for similar past projects</text>
                    <text x="30" y="80" fill="#a5b4fc" fontSize="9">• Coding/Sentinel query code patterns & anti-patterns</text>
                    <text x="20" y="97" fill="#fdba74" fontSize="9" fontWeight="bold">Playbook (orange) - Static prompt injection:</text>
                    <text x="30" y="112" fill="#fed7aa" fontSize="9">• Rules, guidelines, best practices in system prompt</text>
                    <text x="30" y="125" fill="#fed7aa" fontSize="9">• Injected into ALL agents at task start</text>
                    <text x="20" y="142" fill="#4ade80" fontSize="9">→ Deploy triggers RAG reindex, Playbook updated periodically</text>
                  </g>
                </svg>
              </div>
            )}

            {/* Failure Loop View */}
            {activeSection === 'failure' && (
              <div className="bg-slate-800 rounded-xl p-4 overflow-x-auto">
                <svg width="900" height="550" viewBox="0 0 900 550">
                  <defs>
                    <pattern id="grid2" width="20" height="20" patternUnits="userSpaceOnUse">
                      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#334155" strokeWidth="0.5" opacity="0.3"/>
                    </pattern>
                  </defs>
                  <rect width="100%" height="100%" fill="url(#grid2)" />
                  
                  {/* Main Flow */}
                  <AgentNode name="Coding Agent" color="#16a34a" x={200} y={100} icon="💻" description="Implements code" />
                  <AgentNode name="Sentinel" color="#ea580c" x={450} y={100} icon="🛡️" description="Reviews PR" />
                  <AgentNode name="Deploy Agent" color="#dc2626" x={700} y={100} icon="🚀" description="Ships to prod" />
                  
                  {/* Forward arrow */}
                  <Arrow x1={275} y1={100} x2={375} y2={100} color="#22c55e" label="Submit PR" />
                  
                  {/* Decision Diamond */}
                  <g transform="translate(450, 200)">
                    <polygon points="0,-35 50,0 0,35 -50,0" fill="#fbbf24" stroke="#f59e0b" strokeWidth="2"/>
                    <text y="5" textAnchor="middle" fill="#1e293b" fontSize="11" fontWeight="bold">REVIEW</text>
                  </g>
                  
                  <Arrow x1={450} y1={130} x2={450} y2={160} color="#fb923c" />
                  
                  {/* Pass path */}
                  <Arrow x1={500} y1={200} x2={620} y2={100} color="#22c55e" label="✅ PASS" labelOffset={30} />
                  
                  {/* Fail path - loops back */}
                  <g>
                    <defs>
                      <marker id="arrowhead-fail" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444" />
                      </marker>
                    </defs>
                    <path
                      d="M 400 200 Q 300 280 200 200"
                      fill="none"
                      stroke="#ef4444"
                      strokeWidth="2"
                      strokeDasharray="5,5"
                      markerEnd="url(#arrowhead-fail)"
                    />
                    <text x="300" y="270" textAnchor="middle" fill="#ef4444" fontSize="11" fontWeight="bold">❌ FAIL</text>
                  </g>
                  
                  {/* Feedback Details Box */}
                  <g transform="translate(100, 280)">
                    <rect width="250" height="180" rx="8" fill="#1e293b" stroke="#ef4444" strokeWidth="2" />
                    <text x="125" y="25" textAnchor="middle" fill="#fca5a5" fontSize="12" fontWeight="bold">🔴 Failure Feedback Loop</text>
                    <line x1="15" y1="35" x2="235" y2="35" stroke="#475569" />
                    <text x="15" y="55" fill="#94a3b8" fontSize="10">Sentinel provides:</text>
                    <text x="25" y="75" fill="#fca5a5" fontSize="10">• Specific failure reasons</text>
                    <text x="25" y="92" fill="#fca5a5" fontSize="10">• Line-by-line code feedback</text>
                    <text x="25" y="109" fill="#fca5a5" fontSize="10">• Test failure outputs</text>
                    <text x="25" y="126" fill="#fca5a5" fontSize="10">• Security vulnerability flags</text>
                    <text x="25" y="143" fill="#fca5a5" fontSize="10">• Style/lint violations</text>
                    <text x="15" y="165" fill="#94a3b8" fontSize="10">Max retries: 3 → Human escalation</text>
                  </g>
                  
                  {/* Retry Counter */}
                  <g transform="translate(370, 280)">
                    <rect width="180" height="180" rx="8" fill="#1e293b" stroke="#fbbf24" strokeWidth="2" />
                    <text x="90" y="25" textAnchor="middle" fill="#fde047" fontSize="12" fontWeight="bold">🔄 Retry Logic</text>
                    <line x1="15" y1="35" x2="165" y2="35" stroke="#475569" />
                    <text x="15" y="55" fill="#94a3b8" fontSize="10">Attempt tracking:</text>
                    <text x="25" y="80" fill="#4ade80" fontSize="11">① First try: Fresh implementation</text>
                    <text x="25" y="100" fill="#fde047" fontSize="11">② Retry 1: Apply feedback</text>
                    <text x="25" y="120" fill="#fb923c" fontSize="11">③ Retry 2: Focused fixes</text>
                    <text x="25" y="140" fill="#f87171" fontSize="11">④ Retry 3: Final attempt</text>
                    <text x="25" y="165" fill="#ef4444" fontSize="11">⚠️ Escalate → HITL Queue</text>
                  </g>
                  
                  {/* Human Escalation */}
                  <g transform="translate(570, 280)">
                    <rect width="220" height="180" rx="8" fill="#1e293b" stroke="#8b5cf6" strokeWidth="2" />
                    <text x="110" y="25" textAnchor="middle" fill="#c4b5fd" fontSize="12" fontWeight="bold">👤 Human-in-the-Loop</text>
                    <line x1="15" y1="35" x2="205" y2="35" stroke="#475569" />
                    <text x="15" y="55" fill="#94a3b8" fontSize="10">When automated fails:</text>
                    <text x="25" y="75" fill="#c4b5fd" fontSize="10">• Ticket flagged for review</text>
                    <text x="25" y="92" fill="#c4b5fd" fontSize="10">• Human reviews failure chain</text>
                    <text x="25" y="109" fill="#c4b5fd" fontSize="10">• Manual fix or guidance</text>
                    <text x="25" y="126" fill="#c4b5fd" fontSize="10">• Learning captured for playbook</text>
                    <text x="15" y="150" fill="#94a3b8" fontSize="10">Human actions:</text>
                    <text x="25" y="168" fill="#4ade80" fontSize="10">Approve | Reject | Modify | Split ticket</text>
                  </g>
                  
                  {/* Escalation arrow */}
                  <defs>
                    <marker id="arrowhead-escalate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                      <polygon points="0 0, 10 3.5, 0 7" fill="#8b5cf6" />
                    </marker>
                  </defs>
                  <path
                    d="M 460 240 L 460 260 L 570 260 L 570 280"
                    fill="none"
                    stroke="#8b5cf6"
                    strokeWidth="2"
                    markerEnd="url(#arrowhead-escalate)"
                  />
                  <text x="510" y="250" fill="#8b5cf6" fontSize="10">After 3 fails</text>
                </svg>
              </div>
            )}

            {/* Learning System View */}
            {activeSection === 'learning' && (
