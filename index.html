<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Pipeline Architecture</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { margin: 0; padding: 0; background: #09090b; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    // Inline SVG Icons with background squares for visibility
    const Icons = {
      User: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      ),
      MessageSquare: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      ),
      FileText: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
          <polyline points="10 9 9 9 8 9"/>
        </svg>
      ),
      Ticket: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
          <path d="M13 5v2"/>
          <path d="M13 17v2"/>
          <path d="M13 11v2"/>
        </svg>
      ),
      Code: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="16 18 22 12 16 6"/>
          <polyline points="8 6 2 12 8 18"/>
        </svg>
      ),
      Shield: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      ),
      Rocket: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
          <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
          <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
          <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
        </svg>
      ),
      Database: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <ellipse cx="12" cy="5" rx="9" ry="3"/>
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
        </svg>
      ),
      BookOpen: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
      ),
      RefreshCw: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 2v6h-6"/>
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
          <path d="M3 22v-6h6"/>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
        </svg>
      ),
      Brain: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
          <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
        </svg>
      ),
      GitBranch: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="6" y1="3" x2="6" y2="15"/>
          <circle cx="18" cy="6" r="3"/>
          <circle cx="6" cy="18" r="3"/>
          <path d="M18 9a9 9 0 0 1-9 9"/>
        </svg>
      ),
      Zap: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      ),
      Users: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      ),
      CheckCircle: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
      ),
      XCircle: ({ size = 16, color = "#fff" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
      )
    };

    // Icon wrapper with lighter background for visibility
    const IconWithBg = ({ icon, size = 16, color = "#fff", bgColor = "rgba(255,255,255,0.15)" }) => {
      const IconComponent = Icons[icon];
      return (
        <div style={{
          display: 'inline-flex',
          alignItems: 'center',
          justifyContent: 'center',
          width: size + 12,
          height: size + 12,
          borderRadius: 6,
          backgroundColor: bgColor,
          marginRight: 6
        }}>
          <IconComponent size={size} color={color} />
        </div>
      );
    };

    const SwarmAgentFlowDiagram = () => {
      const [activeSection, setActiveSection] = useState('main');
      
      // Swarm color palette
      const colors = {
        bg: '#09090b',
        cardBg: '#0f0f12',
        border: 'rgba(255,255,255,0.06)',
        primary: '#00d4ff',
        clarifying: '#8b5cf6',
        spec: '#3b82f6',
        ticket: '#06b6d4',
        coding: '#22c55e',
        sentinel: '#f97316',
        deploy: '#ef4444',
        rag: '#8b5cf6',
        playbook: '#f97316',
        user: '#10b981'
      };

      const AgentNode = ({ name, color, x, y, icon, description }) => {
        const IconComponent = Icons[icon];
        return (
          <g transform={`translate(${x}, ${y})`}>
            <defs>
              <linearGradient id={`grad-${name.replace(/\s/g, '')}`} x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stopColor={color} stopOpacity="1"/>
                <stop offset="100%" stopColor={color} stopOpacity="0.7"/>
              </linearGradient>
            </defs>
            <rect
              x="-70"
              y="-30"
              width="140"
              height="60"
              rx="10"
              fill={`url(#grad-${name.replace(/\s/g, '')})`}
              stroke="rgba(255,255,255,0.1)"
              strokeWidth="1"
            />
            {/* Icon background for visibility */}
            <rect x="-60" y="-20" width="24" height="24" rx="5" fill="rgba(255,255,255,0.25)" />
            <g transform="translate(-56, -16)">
              <IconComponent size={16} color="white" />
            </g>
            <text
              x="5"
              y="-5"
              textAnchor="middle"
              fill="white"
              fontSize="11"
              fontWeight="600"
            >
              {name}
            </text>
            <text
              x="0"
              y="15"
              textAnchor="middle"
              fill="rgba(255,255,255,0.7)"
              fontSize="9"
            >
              {description}
            </text>
          </g>
        );
      };

      const Arrow = ({ x1, y1, x2, y2, color = "#64748b", label, labelOffset = 0, curved = false, dashed = false }) => {
        const midX = (x1 + x2) / 2;
        const midY = (y1 + y2) / 2;
        const id = `arrow-${Math.random().toString(36).substr(2, 9)}`;
        
        if (curved) {
          const controlX = midX + labelOffset;
          const controlY = midY - 40;
          return (
            <g>
              <defs>
                <marker id={id} markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                  <polygon points="0 0, 10 3.5, 0 7" fill={color} />
                </marker>
              </defs>
              <path
                d={`M ${x1} ${y1} Q ${controlX} ${controlY} ${x2} ${y2}`}
                fill="none"
                stroke={color}
                strokeWidth="2"
                strokeDasharray={dashed ? "5,5" : "none"}
                markerEnd={`url(#${id})`}
              />
              {label && (
                <text x={controlX} y={controlY - 5} textAnchor="middle" fill={color} fontSize="10" fontWeight="500">
                  {label}
                </text>
              )}
            </g>
          );
        }
        
        return (
          <g>
            <defs>
              <marker id={id} markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill={color} />
              </marker>
            </defs>
            <line x1={x1} y1={y1} x2={x2} y2={y2} stroke={color} strokeWidth="2" strokeDasharray={dashed ? "5,5" : "none"} markerEnd={`url(#${id})`} />
            {label && (
              <text x={midX + labelOffset} y={midY - 8} textAnchor="middle" fill={color} fontSize="10" fontWeight="500">
                {label}
              </text>
            )}
          </g>
        );
      };

      return (
        <div style={{ background: colors.bg, minHeight: '100vh', padding: '24px' }}>
          <div className="max-w-6xl mx-auto">
            <h1 className="text-2xl font-bold text-white mb-2 text-center flex items-center justify-center gap-3">
              <IconWithBg icon="Zap" size={20} color={colors.primary} bgColor="rgba(0,212,255,0.2)" />
              Agent Pipeline Architecture
            </h1>
            <p style={{ color: 'rgba(255,255,255,0.5)' }} className="text-center mb-6 text-sm">
              Information flow, failure recovery, and continuous learning system
            </p>
            
            {/* Tab Navigation */}
            <div className="flex justify-center gap-2 mb-6">
              {[
                { id: 'main', icon: 'GitBranch', label: 'Main Pipeline' },
                { id: 'failure', icon: 'RefreshCw', label: 'Failure Loop' },
                { id: 'learning', icon: 'Brain', label: 'Learning System' }
              ].map(({ id, icon, label }) => (
                <button
                  key={id}
                  onClick={() => setActiveSection(id)}
                  className="flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all cursor-pointer"
                  style={{
                    background: activeSection === id ? colors.primary : colors.cardBg,
                    color: activeSection === id ? '#000' : 'rgba(255,255,255,0.7)',
                    border: `1px solid ${activeSection === id ? colors.primary : colors.border}`
                  }}
                >
                  <IconWithBg 
                    icon={icon} 
                    size={14} 
                    color={activeSection === id ? '#000' : 'rgba(255,255,255,0.7)'} 
                    bgColor={activeSection === id ? 'rgba(0,0,0,0.2)' : 'rgba(255,255,255,0.1)'} 
                  />
                  {label}
                </button>
              ))}
            </div>

            {/* Main Pipeline View */}
            {activeSection === 'main' && (
              <div style={{ background: colors.cardBg, border: `1px solid ${colors.border}` }} className="rounded-xl p-4 overflow-x-auto">
                <svg width="1100" height="480" viewBox="0 0 1100 480">
                  <defs>
                    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="0.5"/>
                    </pattern>
                  </defs>
                  <rect width="100%" height="100%" fill="url(#grid)" />
                  
                  {/* User Input */}
                  <g transform="translate(80, 100)">
                    <circle r="38" fill={colors.user} stroke="rgba(255,255,255,0.2)" strokeWidth="2"/>
                    <rect x="-12" y="-20" width="24" height="24" rx="5" fill="rgba(255,255,255,0.25)" />
                    <g transform="translate(-8, -16)">
                      <Icons.User size={16} color="white" />
                    </g>
                    <text y="18" textAnchor="middle" fill="white" fontSize="10" fontWeight="600">USER</text>
                  </g>
                  
                  {/* Main Agent Flow */}
                  <Arrow x1="118" y1="100" x2="160" y2="100" color={colors.primary} />
                  <AgentNode name="Clarifying" color={colors.clarifying} x={230} y={100} icon="MessageSquare" description="Gather requirements" />
                  
                  <Arrow x1="300" y1="100" x2="340" y2="100" color={colors.primary} />
                  <AgentNode name="Spec" color={colors.spec} x={410} y={100} icon="FileText" description="Write specification" />
                  
                  <Arrow x1="480" y1="100" x2="520" y2="100" color={colors.primary} />
                  <AgentNode name="Ticket" color={colors.ticket} x={590} y={100} icon="Ticket" description="Create work items" />
                  
                  <Arrow x1="660" y1="100" x2="700" y2="100" color={colors.primary} />
                  <AgentNode name="Coding" color={colors.coding} x={770} y={100} icon="Code" description="Implement code" />
                  
                  <Arrow x1="840" y1="100" x2="880" y2="100" color={colors.primary} />
                  <AgentNode name="Sentinel" color={colors.sentinel} x={950} y={100} icon="Shield" description="Review & validate" />
                  
                  {/* Sentinel branching */}
                  <Arrow x1="950" y1="130" x2="950" y2="180" color={colors.coding} label="✓ Pass" labelOffset={35} />
                  <AgentNode name="Deploy" color={colors.deploy} x={950} y={230} icon="Rocket" description="Ship to production" />
                  
                  {/* RAG Integration */}
                  <g transform="translate(350, 280)">
                    <rect width="200" height="150" rx="12" fill="#1a1625" stroke={colors.rag} strokeWidth="2" />
                    <rect x="80" y="12" width="24" height="24" rx="5" fill="rgba(139,92,246,0.3)" />
                    <g transform="translate(84, 16)">
                      <Icons.Database size={16} color={colors.rag} />
                    </g>
                    <text x="100" y="55" textAnchor="middle" fill="white" fontSize="13" fontWeight="600">RAG Knowledge</text>
                    <text x="100" y="72" textAnchor="middle" fill="rgba(255,255,255,0.5)" fontSize="9">Vector Embeddings</text>
                    <line x1="15" y1="82" x2="185" y2="82" stroke="rgba(139,92,246,0.3)" />
                    <text x="20" y="100" fill="rgba(255,255,255,0.7)" fontSize="9">• Code patterns</text>
                    <text x="20" y="115" fill="rgba(255,255,255,0.7)" fontSize="9">• Anti-patterns</text>
                    <text x="20" y="130" fill="rgba(255,255,255,0.7)" fontSize="9">• Security rules</text>
                    <text x="105" y="100" fill="rgba(255,255,255,0.7)" fontSize="9">• Best practices</text>
                    <text x="105" y="115" fill="rgba(255,255,255,0.7)" fontSize="9">• Past solutions</text>
                  </g>
                  
                  {/* Playbook */}
                  <g transform="translate(600, 280)">
                    <rect width="200" height="150" rx="12" fill="#1a1510" stroke={colors.playbook} strokeWidth="2" />
                    <rect x="80" y="12" width="24" height="24" rx="5" fill="rgba(249,115,22,0.3)" />
                    <g transform="translate(84, 16)">
                      <Icons.BookOpen size={16} color={colors.playbook} />
                    </g>
                    <text x="100" y="55" textAnchor="middle" fill="white" fontSize="13" fontWeight="600">Playbook</text>
                    <text x="100" y="72" textAnchor="middle" fill="rgba(255,255,255,0.5)" fontSize="9">Static Rules</text>
                    <line x1="15" y1="82" x2="185" y2="82" stroke="rgba(249,115,22,0.3)" />
                    <text x="20" y="100" fill="rgba(255,255,255,0.7)" fontSize="9">• Coding standards</text>
                    <text x="20" y="115" fill="rgba(255,255,255,0.7)" fontSize="9">• Architecture guidelines</text>
                    <text x="20" y="130" fill="rgba(255,255,255,0.7)" fontSize="9">• Project-specific rules</text>
                  </g>
                  
                  {/* Dashed lines from RAG/Playbook to agents */}
                  <path d="M 450 280 L 450 200 L 410 130" stroke={colors.rag} strokeWidth="1.5" strokeDasharray="4,4" fill="none" />
                  <path d="M 500 280 L 590 180 L 770 130" stroke={colors.rag} strokeWidth="1.5" strokeDasharray="4,4" fill="none" />
                  <path d="M 700 280 L 700 200 L 770 130" stroke={colors.playbook} strokeWidth="1.5" strokeDasharray="4,4" fill="none" />
                  <path d="M 750 280 L 850 180 L 950 130" stroke={colors.playbook} strokeWidth="1.5" strokeDasharray="4,4" fill="none" />
                  
                  <text x="430" y="195" fill={colors.rag} fontSize="8" fontWeight="500">Query context</text>
                  <text x="720" y="195" fill={colors.playbook} fontSize="8" fontWeight="500">Inject rules</text>
                </svg>
              </div>
            )}

            {/* Failure Loop View */}
            {activeSection === 'failure' && (
              <div style={{ background: colors.cardBg, border: `1px solid ${colors.border}` }} className="rounded-xl p-4 overflow-x-auto">
                <svg width="900" height="400" viewBox="0 0 900 400">
                  <defs>
                    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
                      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="0.5"/>
                    </pattern>
                  </defs>
                  <rect width="100%" height="100%" fill="url(#grid2)" />
                  
                  <AgentNode name="Coding" color={colors.coding} x={150} y={100} icon="Code" description="Implement code" />
                  <Arrow x1="220" y1="100" x2="320" y2="100" color={colors.primary} />
                  <AgentNode name="Sentinel" color={colors.sentinel} x={400} y={100} icon="Shield" description="Review & validate" />
                  
                  {/* Pass path */}
                  <Arrow x1="470" y1="100" x2="570" y2="100" color={colors.coding} label="✓ Pass" labelOffset={0} />
                  <AgentNode name="Deploy" color={colors.deploy} x={650} y={100} icon="Rocket" description="Ship to production" />
                  
                  {/* Fail path */}
                  <path d="M 400 130 L 400 220 L 250 220 L 250 160 L 150 130" stroke={colors.deploy} strokeWidth="2" fill="none" markerEnd="url(#fail-arrow)" />
                  <defs>
                    <marker id="fail-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                      <polygon points="0 0, 10 3.5, 0 7" fill={colors.deploy} />
                    </marker>
                  </defs>
                  
                  {/* Retry counter */}
                  <g transform="translate(280, 200)">
                    <rect x="-50" y="-18" width="100" height="36" rx="8" fill="rgba(239,68,68,0.2)" stroke={colors.deploy} strokeWidth="1" />
                    <rect x="-42" y="-10" width="20" height="20" rx="4" fill="rgba(255,255,255,0.15)" />
                    <g transform="translate(-38, -6)">
                      <Icons.RefreshCw size={12} color={colors.deploy} />
                    </g>
                    <text x="15" y="5" textAnchor="middle" fill={colors.deploy} fontSize="11" fontWeight="600">Retry ≤3</text>
                  </g>
                  
                  {/* HITL Escalation */}
                  <path d="M 400 130 L 400 320" stroke="#fbbf24" strokeWidth="2" strokeDasharray="5,5" fill="none" />
                  <g transform="translate(400, 350)">
                    <rect x="-90" y="-25" width="180" height="50" rx="10" fill="rgba(251,191,36,0.2)" stroke="#fbbf24" strokeWidth="2" />
                    <rect x="-78" y="-13" width="24" height="24" rx="5" fill="rgba(255,255,255,0.15)" />
                    <g transform="translate(-74, -9)">
                      <Icons.Users size={16} color="#fbbf24" />
                    </g>
                    <text x="10" y="-2" textAnchor="middle" fill="#fbbf24" fontSize="12" fontWeight="600">HITL Escalation</text>
                    <text x="0" y="14" textAnchor="middle" fill="rgba(251,191,36,0.7)" fontSize="9">After 3 failures</text>
                  </g>
                  
                  {/* Rejection reason box */}
                  <g transform="translate(600, 220)">
                    <rect x="-100" y="-50" width="200" height="100" rx="10" fill="rgba(239,68,68,0.1)" stroke="rgba(239,68,68,0.3)" strokeWidth="1" />
                    <text x="0" y="-30" textAnchor="middle" fill={colors.deploy} fontSize="11" fontWeight="600">Rejection Reasons</text>
                    <text x="-85" y="-10" fill="rgba(255,255,255,0.6)" fontSize="9">• Failed tests</text>
                    <text x="-85" y="5" fill="rgba(255,255,255,0.6)" fontSize="9">• Security vulnerabilities</text>
                    <text x="-85" y="20" fill="rgba(255,255,255,0.6)" fontSize="9">• Doesn't meet spec</text>
                    <text x="-85" y="35" fill="rgba(255,255,255,0.6)" fontSize="9">• Poor code quality</text>
                  </g>
                  
                  <Arrow x1="470" y1="115" x2="510" y2="180" color="rgba(239,68,68,0.5)" dashed={true} />
                </svg>
              </div>
            )}

            {/* Learning System View */}
            {activeSection === 'learning' && (
              <div style={{ background: colors.cardBg, border: `1px solid ${colors.border}` }} className="rounded-xl p-4 overflow-x-auto">
                <svg width="1000" height="450" viewBox="0 0 1000 450">
                  <defs>
                    <pattern id="grid3" width="30" height="30" patternUnits="userSpaceOnUse">
                      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" strokeWidth="0.5"/>
                    </pattern>
                  </defs>
                  <rect width="100%" height="100%" fill="url(#grid3)" />
                  
                  <AgentNode name="Deploy" color={colors.deploy} x={150} y={100} icon="Rocket" description="Merges PR" />
                  
                  {/* Good code path */}
                  <Arrow x1="220" y1="85" x2="300" y2="50" color={colors.coding} />
                  <g transform="translate(380, 50)">
                    <rect x="-70" y="-25" width="140" height="50" rx="8" fill="rgba(34,197,94,0.2)" stroke={colors.coding} strokeWidth="1" />
                    <rect x="-58" y="-13" width="22" height="22" rx="4" fill="rgba(255,255,255,0.15)" />
                    <g transform="translate(-54, -9)">
                      <Icons.CheckCircle size={14} color={colors.coding} />
                    </g>
                    <text x="10" y="0" textAnchor="middle" fill={colors.coding} fontSize="11" fontWeight="600">Good Code</text>
                    <text x="0" y="15" textAnchor="middle" fill="rgba(34,197,94,0.7)" fontSize="8">Patterns indexed</text>
                  </g>
                  
                  {/* Bad code path */}
                  <Arrow x1="220" y1="115" x2="300" y2="150" color={colors.deploy} />
                  <g transform="translate(380, 150)">
                    <rect x="-70" y="-25" width="140" height="50" rx="8" fill="rgba(239,68,68,0.2)" stroke={colors.deploy} strokeWidth="1" />
                    <rect x="-58" y="-13" width="22" height="22" rx="4" fill="rgba(255,255,255,0.15)" />
                    <g transform="translate(-54, -9)">
                      <Icons.XCircle size={14} color={colors.deploy} />
                    </g>
                    <text x="10" y="0" textAnchor="middle" fill={colors.deploy} fontSize="11" fontWeight="600">Bad Code</text>
                    <text x="0" y="15" textAnchor="middle" fill="rgba(239,68,68,0.7)" fontSize="8">Anti-patterns indexed</text>
                  </g>
                  
                  {/* Arrows to RAG */}
                  <Arrow x1="450" y1="50" x2="550" y2="100" color={colors.coding} />
                  <Arrow x1="450" y1="150" x2="550" y2="120" color={colors.deploy} />
                  
                  {/* RAG Knowledge Base */}
                  <g transform="translate(550, 70)">
                    <rect width="250" height="200" rx="12" fill="#1a1625" stroke={colors.rag} strokeWidth="2" />
                    <rect x="105" y="12" width="28" height="28" rx="5" fill="rgba(139,92,246,0.3)" />
                    <g transform="translate(109, 16)">
                      <Icons.Database size={20} color={colors.rag} />
                    </g>
                    <text x="125" y="60" textAnchor="middle" fill="white" fontSize="14" fontWeight="700">RAG Knowledge</text>
                    <text x="125" y="77" textAnchor="middle" fill="rgba(255,255,255,0.5)" fontSize="10">Continuously Updated</text>
                    <line x1="20" y1="90" x2="230" y2="90" stroke="rgba(139,92,246,0.3)" />
                    
                    <text x="30" y="110" fill={colors.coding} fontSize="10" fontWeight="500">✓ Good Patterns:</text>
                    <text x="40" y="125" fill="rgba(255,255,255,0.6)" fontSize="9">Working implementations</text>
                    <text x="40" y="140" fill="rgba(255,255,255,0.6)" fontSize="9">Successful architectures</text>
                    
                    <text x="30" y="160" fill={colors.deploy} fontSize="10" fontWeight="500">✗ Anti-Patterns:</text>
                    <text x="40" y="175" fill="rgba(255,255,255,0.6)" fontSize="9">Failed approaches</text>
                    <text x="40" y="190" fill="rgba(255,255,255,0.6)" fontSize="9">Security vulnerabilities</text>
                  </g>
                  
                  {/* Arrow to agents */}
                  <Arrow x1="800" y1="170" x2="870" y2="170" color={colors.primary} label="Query" labelOffset={0} />
                  
                  {/* Agents receiving knowledge */}
                  <g transform="translate(900, 100)">
                    <rect x="-25" y="-20" width="50" height="40" rx="8" fill={colors.clarifying} />
                    <rect x="-16" y="-11" width="18" height="18" rx="3" fill="rgba(255,255,255,0.2)" />
                    <g transform="translate(-13, -8)">
                      <Icons.MessageSquare size={12} color="white" />
                    </g>
                  </g>
                  <g transform="translate(900, 170)">
                    <rect x="-25" y="-20" width="50" height="40" rx="8" fill={colors.coding} />
                    <rect x="-16" y="-11" width="18" height="18" rx="3" fill="rgba(255,255,255,0.2)" />
                    <g transform="translate(-13, -8)">
                      <Icons.Code size={12} color="white" />
                    </g>
                  </g>
                  <g transform="translate(900, 240)">
                    <rect x="-25" y="-20" width="50" height="40" rx="8" fill={colors.sentinel} />
                    <rect x="-16" y="-11" width="18" height="18" rx="3" fill="rgba(255,255,255,0.2)" />
                    <g transform="translate(-13, -8)">
                      <Icons.Shield size={12} color="white" />
                    </g>
                  </g>
                  
                  {/* Feedback loop */}
                  <g transform="translate(100, 350)">
                    <rect width="800" height="80" rx="10" fill="rgba(0,212,255,0.1)" stroke={colors.primary} strokeWidth="1" />
                    <rect x="362" y="12" width="28" height="28" rx="5" fill="rgba(0,212,255,0.2)" />
                    <g transform="translate(366, 16)">
                      <Icons.RefreshCw size={20} color={colors.primary} />
                    </g>
                    <text x="400" y="58" textAnchor="middle" fill={colors.primary} fontSize="12" fontWeight="600">
                      Continuous Learning Cycle
                    </text>
                    <text x="400" y="73" textAnchor="middle" fill="rgba(0,212,255,0.7)" fontSize="10">
                      Every deployment makes the system smarter — knowledge compounds automatically
                    </text>
                  </g>
                  
                  {/* Loop arrows */}
                  <path d="M 150 130 L 150 350" stroke={colors.primary} strokeWidth="2" strokeDasharray="5,5" fill="none" />
                  <path d="M 870 240 L 870 350 L 850 350" stroke={colors.primary} strokeWidth="2" strokeDasharray="5,5" fill="none" />
                </svg>
              </div>
            )}

            {/* Summary Cards */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
              <div style={{ background: colors.cardBg, border: `1px solid ${colors.border}` }} className="rounded-lg p-4">
                <h3 className="text-white font-bold mb-2 flex items-center gap-2">
                  <IconWithBg icon="GitBranch" size={14} color={colors.primary} bgColor="rgba(0,212,255,0.2)" />
                  Pipeline + Knowledge
                </h3>
                <p style={{ color: 'rgba(255,255,255,0.5)' }} className="text-sm">
                  <span style={{ color: colors.playbook }}>Playbook</span> (static rules) injected into ALL agent prompts.
                  <span style={{ color: colors.rag }}> RAG</span> (dynamic) queried by agents for context-specific patterns.
                </p>
              </div>
              <div style={{ background: colors.cardBg, border: `1px solid ${colors.border}` }} className="rounded-lg p-4">
                <h3 className="text-white font-bold mb-2 flex items-center gap-2">
                  <IconWithBg icon="RefreshCw" size={14} color={colors.deploy} bgColor="rgba(239,68,68,0.2)" />
                  Failure Recovery
                </h3>
                <p style={{ color: 'rgba(255,255,255,0.5)' }} className="text-sm">
                  Sentinel rejection triggers retry loop. Failed patterns indexed as anti-patterns.
                  Max 3 retries before human escalation.
                </p>
              </div>
              <div style={{ background: colors.cardBg, border: `1px solid ${colors.border}` }} className="rounded-lg p-4">
                <h3 className="text-white font-bold mb-2 flex items-center gap-2">
                  <IconWithBg icon="Brain" size={14} color={colors.rag} bgColor="rgba(139,92,246,0.2)" />
                  RAG vs Playbook
                </h3>
                <p style={{ color: 'rgba(255,255,255,0.5)' }} className="text-sm">
                  <span style={{ color: colors.rag }}>RAG</span>: Dynamic queries, reindexed on every deploy. 
                  <span style={{ color: colors.playbook }}> Playbook</span>: Static rules in system prompt.
                </p>
              </div>
            </div>
            
            {/* Footer */}
            <div className="text-center mt-8 text-sm" style={{ color: 'rgba(255,255,255,0.3)' }}>
              Agent Pipeline Architecture • Swarm Project
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SwarmAgentFlowDiagram />);
  </script>
</body>
</html>
